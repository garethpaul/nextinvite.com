application: nextinvitation
version: 1
runtime: python
api_version: 1

handlers:
- url: /static/
  static_dir: static
  secure: always

- url: /robots\.txt
  static_files: static/robots.txt
  upload: static/robots.txt
  secure: always

- url: /favicon\.ico
  static_files: static/favicon.ico
  upload: static/favicon.ico
  secure: always

- url: /.*
  script: server.py
  secure: always
